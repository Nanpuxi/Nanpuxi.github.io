const rand = arr => arr[Math.floor(Math.random()*arr.length)];

// ========== 后缀网格 ==========
function renderSuffixGrid() {
  const grid = $('suffixGrid');
  grid.innerHTML = '';
  const all = [...DEFAULT_SUFFIXES, ...customSuffixSet];
  all.forEach(suf => {
    const lbl = document.createElement('label');
    const checked = selectedSuffixes.has(suf);
    if (checked) lbl.classList.add('checked');
    lbl.innerHTML = `<input type="checkbox" value="${suf}" ${checked?'checked':''}> ${suf}`;
    lbl.querySelector('input').addEventListener('change', e => {
      if (e.target.checked) { selectedSuffixes.add(suf); lbl.classList.add('checked'); }
      else { selectedSuffixes.delete(suf); lbl.classList.remove('checked'); }
      updateSuffixInfo();
    });
    grid.appendChild(lbl);
  });
  updateSuffixInfo();
}

function updateSuffixInfo() {
  const arr = [...selectedSuffixes];
  $('suffixCount').textContent = arr.length;
  $('suffixList').textContent = arr.join('');
}

$('selAll').addEventListener('click', () => {
  selectedSuffixes = new Set([...DEFAULT_SUFFIXES, ...customSuffixSet]);
  renderSuffixGrid();
});
$('selNone').addEventListener('click', () => {
  selectedSuffixes.clear();
  renderSuffixGrid();
});

$('addSuffix').addEventListener('click', () => {
  const v = $('customSuffix').value.trim();
  if (!v) return;
  customSuffixSet.add(v);
  selectedSuffixes.add(v);
  $('customSuffix').value = '';
  renderSuffixGrid();
});

// ========== 单选高亮 ==========
function bindRadioHighlight(groupName, containerId) {
  document.querySelectorAll(`input[name="${groupName}"]`).forEach(r => {
    r.addEventListener('change', () => {
      document.querySelectorAll(`#${containerId} label`).forEach(l => l.classList.remove('active'));
      r.closest('label').classList.add('active');
    });
  });
}
bindRadioHighlight('nameType', 'typeGroup');
bindRadioHighlight('nameLen', 'lenGroup');
document.querySelector('#typeGroup label').classList.add('active');
document.querySelector('#lenGroup label').classList.add('active');

// ========== 核心生成逻辑 ==========
function isPlausible(name) {
  if (REAL_PLACES.has(name)) return false;
  if (name.length < 2) return false;
  if (/[，。、；：！？·\/\-]/.test(name)) return false;
  return true;
}

function getPrefix(prefixLen, suffix) {
  const isModifiedRoad = /^(大|南|北|东|西|前|后|上|下|直|横)/.test(suffix);

  if (prefixLen === 1) {
    if (isModifiedRoad) return rand(P1_LONG_SUF);
    return rand(P1_SHORT);
  }

  if (prefixLen === 2) {
    if (isModifiedRoad) {
      for (let i = 0; i < 5; i++) {
        const c = rand(P2);
        if (c.length <= 2) return c;
      }
      return rand(P2);
    }
    if (Math.random() < 0.85) return rand(P2);
    return makeP1Pair();
  }

  if (prefixLen === 3) {
    if (Math.random() < 0.65) return rand(P2) + rand(P1_SHORT);
    return rand(P1_SHORT) + rand(P2);
  }

  return rand(P2) + rand(P2);
}

function makeP1Pair() {
  for (let i = 0; i < 10; i++) {
    const a = rand(P1_SHORT), b = rand(P1_SHORT);
    if (a === b) continue;
    const c = a + b;
    if (/^(东|西|南|北|中)(东|西|南|北|中)/.test(c)) continue;
    if (/^(大|小|长|高|新|老|古)(大|小|长|高|新|老|古)/.test(c)) continue;
    if (/^(青|红|白|金|碧|翠|紫)(青|红|白|金|碧|翠|紫)/.test(c)) continue;
    if (/^(山|水|江|河|湖|海|溪)(山|水|江|河|湖|海|溪)/.test(c)) continue;
    if (/^(松|柏|柳|枫|梅|兰|竹|菊|荷)(松|柏|柳|枫|梅|兰|竹|菊|荷)/.test(c)) continue;
    if (/^(龙|凤|鹤|燕|莺|鹭)(龙|凤|鹤|燕|莺|鹭)/.test(c)) continue;
    if (/^(安|康|福|兴|盛|昌|隆)(安|康|福|兴|盛|昌|隆)/.test(c)) continue;
    if (/^(和|平|秀|雅|瑞|馨)(和|平|秀|雅|瑞|馨)/.test(c)) continue;
    if (/^(城|市|街|桥|门|楼|苑|府)(城|市|街|桥|门|楼|苑|府)/.test(c)) continue;
    if (/^(文|书|花|香|玉|宝)(文|书|花|香|玉|宝)/.test(c)) continue;
    if (/^(沙|石|岛|湾|港|坡)(沙|石|岛|湾|港|坡)/.test(c)) continue;
    if (/^(双|三|四|五|六|七|八|九|十)(双|三|四|五|六|七|八|九|十)/.test(c)) continue;
    if (/^(王|李|张|刘|陈|杨|赵|黄|周|吴)(王|李|张|刘|陈|杨|赵|黄|周|吴)/.test(c)) continue;
    return c;
  }
  return rand(P2);
}

function getSuffixPool(type) {
  if (type === 'mixed') return [...selectedSuffixes];
  return TYPE_SUFFIX[type] || [...selectedSuffixes];
}

function generateName(type, nameLen) {
  const suffixPool = getSuffixPool(type);

  for (let attempt = 0; attempt < 500; attempt++) {
    const suffix = rand(suffixPool);
    const sufLen = suffix.length;

    let totalTarget = nameLen;
    if (Math.random() < 0.08) totalTarget += Math.random() < 0.5 ? -1 : 1;
    totalTarget = Math.max(2, Math.min(5, totalTarget));

    const prefixLen = totalTarget - sufLen;
    if (prefixLen < 1) continue;

    const prefix = getPrefix(prefixLen, suffix);
    if (!prefix) continue;

    const name = prefix + suffix;
    if (name.length < 2 || name.length > 5) continue;
    if (isPlausible(name)) return name;
  }

  return rand(P2) + rand(['路','街','桥','门','公园','广场','城','村','湾','湖','河','山','园','苑','庄','楼']);
}

// ========== 生成按钮 ==========
let totalGenerated = 0;
const resultBox = $('resultBox');

$('genBtn').addEventListener('click', () => {
  const count = Math.min(500, Math.max(1, parseInt($('genCount').value) || 20));
  const type = document.querySelector('input[name="nameType"]:checked').value;
  const nameLen = parseInt(document.querySelector('input[name="nameLen"]:checked').value);

  const results = new Set();
  const thisBatch = [];
  let safety = 0;

  while (thisBatch.length < count && safety < count * 200) {
    safety++;
    const name = generateName(type, nameLen);
    if (results.has(name)) continue;
    results.add(name);
    thisBatch.push(name);
  }

  totalGenerated += thisBatch.length;
  $('genTotal').textContent = totalGenerated;

  resultBox.innerHTML = '<div class="result-list">' +
    thisBatch.map(n => `<div class="result-item">${n}</div>`).join('') +
    '</div>';
  resultBox.dataset.text = thisBatch.join('\n');
});

// ========== 复制 ==========
$('copyBtn').addEventListener('click', () => {
  const text = resultBox.dataset.text || '';
  if (!text) return;
  const btn = $('copyBtn');
  const onSuccess = () => {
    btn.textContent = '已复制 ✓';
    setTimeout(() => btn.textContent = '复制全部', 1500);
  };
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(onSuccess).catch(fallbackCopy);
  } else {
    fallbackCopy();
  }
  function fallbackCopy() {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
    btn.textContent = '已复制 ✓';
    setTimeout(() => btn.textContent = '复制全部', 1500);
  }
});

// ========== Toast ==========
function showToast(msg) {
  const toast = $('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// ========== 初始化 ==========
renderSuffixGrid();
</script>
