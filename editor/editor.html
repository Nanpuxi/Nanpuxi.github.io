<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文件库</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 20px; }
.container { max-width: 900px; margin: 0 auto; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding: 20px; background: #1e293b; border-radius: 12px; }
.header h1 { font-size: 1.5rem; }
.auth-area { display: flex; gap: 10px; align-items: center; }
.auth-area button { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
.btn-login { background: #3b82f6; color: white; }
.btn-register { background: #10b981; color: white; }
.btn-logout { background: #ef4444; color: white; }
.btn-upload { background: #8b5cf6; color: white; }
.status { font-size: 0.85rem; color: #94a3b8; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; }
.modal-overlay.active { display: flex; }
.modal { background: #1e293b; padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; }
.modal h2 { margin-bottom: 20px; }
.modal input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #334155; border-radius: 6px; background: #0f172a; color: #e2e8f0; }
.modal-actions { display: flex; gap: 10px; }
.modal-actions button { flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; }
.btn-confirm { background: #3b82f6; color: white; }
.btn-cancel { background: #475569; color: white; }
.upload-area { margin-bottom: 20px; padding: 20px; border: 2px dashed #334155; border-radius: 12px; text-align: center; }
.upload-area input[type="file"] { margin-top: 10px; }
.files-grid { display: grid; gap: 12px; }
.file-card { background: #1e293b; padding: 16px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
.file-card .info { flex: 1; }
.file-card .name { font-weight: 500; word-break: break-all; }
.file-card .size { font-size: 0.8rem; color: #94a3b8; margin-top: 4px; }
.file-card .actions { display: flex; gap: 8px; }
.file-card button { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
.btn-download { background: #3b82f6; color: white; }
.btn-delete { background: #ef4444; color: white; }
.btn-rename { background: #f59e0b; color: white; }
.toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; color: white; z-index: 200; display: none; max-width: 350px; }
.toast.success { background: #10b981; }
.toast.error { background: #ef4444; }
.toast.active { display: block; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📁 文件库</h1>
    <div class="auth-area">
      <span class="status" id="statusText">未登录</span>
      <button class="btn-login" id="loginBtn" onclick="showModal('loginModal')">登录</button>
      <button class="btn-register" id="registerBtn" onclick="showModal('registerModal')">注册</button>
      <button class="btn-logout" id="logoutBtn" onclick="logout()" style="display:none">退出</button>
      <button class="btn-upload" id="uploadBtn" onclick="showModal('uploadModal')" style="display:none">上传</button>
    </div>
  </div>

  <div class="upload-area" id="uploadArea" style="display:none">
    <p>选择文件上传到仓库</p>
    <input type="file" id="fileInput">
    <button class="btn-confirm" onclick="doUpload()" style="margin-top:10px;padding:8px 16px;border:none;border-radius:6px;background:#8b5cf6;color:white;cursor:pointer">确认上传</button>
  </div>

  <div class="files-grid" id="filesGrid"></div>
</div>

<!-- 登录弹窗 -->
<div class="modal-overlay" id="loginModal">
  <div class="modal">
    <h2>登录</h2>
    <input type="text" id="loginUser" placeholder="用户名">
    <input type="password" id="loginPass" placeholder="密码">
    <div class="modal-actions">
      <button class="btn-confirm" onclick="doLogin()">登录</button>
      <button class="btn-cancel" onclick="hideModal('loginModal')">取消</button>
    </div>
  </div>
</div>

<!-- 注册弹窗 -->
<div class="modal-overlay" id="registerModal">
  <div class="modal">
    <h2>注册</h2>
    <input type="text" id="regUser" placeholder="用户名">
    <input type="password" id="regPass" placeholder="密码（至少6位）">
    <input type="text" id="regInvite" placeholder="邀请码">
    <div class="modal-actions">
      <button class="btn-confirm" onclick="doRegister()">注册</button>
      <button class="btn-cancel" onclick="hideModal('registerModal')">取消</button>
    </div>
  </div>
</div>

<!-- 上传弹窗 -->
<div class="modal-overlay" id="uploadModal">
  <div class="modal">
    <h2>上传文件</h2>
    <p>请在上方选择文件后确认</p>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="hideModal('uploadModal')">关闭</button>
    </div>
  </div>
</div>

<!-- 重命名弹窗 -->
<div class="modal-overlay" id="renameModal">
  <div class="modal">
    <h2>重命名</h2>
    <input type="text" id="newName" placeholder="新文件名">
    <div class="modal-actions">
      <button class="btn-confirm" onclick="confirmRename()">确认</button>
      <button class="btn-cancel" onclick="hideModal('renameModal')">取消</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://sweet-shape-6382.3906951201.workers.dev';
let currentRole = 'guest';
let renameTarget = '';

// 检查登录状态
async function checkAuth() {
  try {
    const r = await fetch(API + '/auth/me', { credentials: 'include' });
    if (r.ok) {
      const d = await r.json();
      currentRole = d.role;
      document.getElementById('statusText').textContent = `已登录: ${d.username} (${d.role})`;
      document.getElementById('loginBtn').style.display = 'none';
      document.getElementById('registerBtn').style.display = 'none';
      document.getElementById('logoutBtn').style.display = 'inline-block';
      if (d.role !== 'guest') {
        document.getElementById('uploadBtn').style.display = 'inline-block';
        document.getElementById('uploadArea').style.display = 'block';
      }
    } else {
      document.getElementById('statusText').textContent = '未登录';
    }
  } catch(e) { console.error(e); }
  loadFiles();
}

// 注册
async function doRegister() {
  const username = document.getElementById('regUser').value.trim();
  const password = document.getElementById('regPass').value;
  const inviteCode = document.getElementById('regInvite').value.trim();
  if (!username || !password) { toast('请填写完整', 'error'); return; }
  const r = await fetch(API + '/auth/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({ username, password, inviteCode })
  });
  const d = await r.json();
  if (d.ok) {
    toast(d.message, 'success');
    hideModal('registerModal');
    // 注册成功后自动登录
    setTimeout(() => doLoginAfterRegister(username, password), 500);
  } else {
    toast(d.message, 'error');
  }
}

// 注册后自动登录
async function doLoginAfterRegister(username, password) {
  const r = await fetch(API + '/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({ username, password })
  });
  const d = await r.json();
  if (d.ok) { checkAuth(); } else { toast('自动登录失败，请手动登录', 'error'); }
}

// 登录
async function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  if (!username || !password) { toast('请填写完整', 'error'); return; }
  const r = await fetch(API + '/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({ username, password })
  });
  const d = await r.json();
  if (d.ok) {
    toast('登录成功', 'success');
    hideModal('loginModal');
    checkAuth();
  } else {
    toast(d.message, 'error');
  }
}

// 退出
async function logout() {
  await fetch(API + '/auth/logout', { method: 'POST', credentials: 'include' });
  location.reload();
}

// 加载文件
async function loadFiles() {
  const r = await fetch(API + '/files', { credentials: 'include' });
  const d = await r.json();
  if (!d.ok) return;
  const grid = document.getElementById('filesGrid');
  grid.innerHTML = '';
  d.files.forEach(f => {
    const card = document.createElement('div');
    card.className = 'file-card';
    card.innerHTML = `
      <div class="info">
        <div class="name">${f.name}</div>
        <div class="size">${(f.size/1024).toFixed(1)} KB</div>
      </div>
      <div class="actions">
        ${f.canDownload ? `<button class="btn-download" onclick="window.open('${f.url}','_blank')">下载</button>` : ''}
        ${f.canRename ? `<button class="btn-rename" onclick="showRename('${f.name}')">重命名</button>` : ''}
        ${f.canDelete ? `<button class="btn-delete" onclick="doDelete('${f.name}')">删除</button>` : ''}
      </div>
    `;
    grid.appendChild(card);
  });
}

// 上传
async function doUpload() {
  const fileInput = document.getElementById('fileInput');
  if (!fileInput.files[0]) { toast('请选择文件', 'error'); return; }
  const formData = new FormData();
  formData.append('file', fileInput.files[0]);
  const r = await fetch(API + '/upload', { method: 'POST', credentials: 'include', body: formData });
  const d = await r.json();
  if (d.ok) { toast('上传成功', 'success'); loadFiles(); hideModal('uploadModal'); }
  else toast(d.message, 'error');
}

// 删除
async function doDelete(name) {
  if (!confirm(`确定删除 ${name}？`)) return;
  const r = await fetch(API + '/delete/' + encodeURIComponent(name), { method: 'DELETE', credentials: 'include' });
  const d = await r.json();
  if (d.ok) { toast('删除成功', 'success'); loadFiles(); }
  else toast(d.message, 'error');
}

// 重命名
function showRename(name) { renameTarget = name; document.getElementById('newName').value = name; showModal('renameModal'); }
async function confirmRename() {
  const newName = document.getElementById('newName').value.trim();
  if (!newName || newName === renameTarget) return;
  const r = await fetch(API + '/rename', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify({ oldName: renameTarget, newName }) });
  const d = await r.json();
  if (d.ok) { toast('重命名成功', 'success'); loadFiles(); hideModal('renameModal'); }
  else toast(d.message, 'error');
}

// UI
function showModal(id) { document.getElementById(id).classList.add('active'); }
function hideModal(id) { document.getElementById(id).classList.remove('active'); }
function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + type + ' active';
  setTimeout(() => t.classList.remove('active'), 4000);
}

checkAuth();
</script>
</body>
</html>
