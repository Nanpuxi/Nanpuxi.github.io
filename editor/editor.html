<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文件库 - Nanpuxi</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; padding: 20px; }
  .container { max-width: 800px; margin: 0 auto; }
  h1 { margin-bottom: 20px; color: #333; }
  
  /* 上传区 */
  .upload-box { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); margin-bottom: 20px; }
  .upload-box input[type="file"] { margin-right: 10px; }
  .upload-box button { padding: 8px 20px; background: #007bff; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  .upload-box button:hover { background: #0056b3; }
  #upload-msg { margin-top: 10px; font-size: 14px; }
  
  /* 文件列表 */
  .file-list { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); overflow: hidden; }
  .file-list h3 { padding: 15px 20px; border-bottom: 1px solid #eee; color: #555; }
  .file-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid #f0f0f0; }
  .file-item:last-child { border-bottom: none; }
  .file-name { color: #333; font-size: 14px; }
  .file-meta { color: #999; font-size: 12px; margin-left: 10px; }
  .file-actions a { padding: 4px 12px; background: #28a745; color: #fff; text-decoration: none; border-radius: 4px; font-size: 13px; }
  .file-actions a:hover { background: #1e7e34; }
  .empty { padding: 30px; text-align: center; color: #999; }
  .refresh-btn { margin-left: 10px; padding: 4px 12px; background: #6c757d; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
</style>
</head>
<body>
<div class="container">
  <h1>📁 文件库</h1>
  
  <!-- 上传 -->
  <div class="upload-box">
    <h3 style="margin-bottom:10px;">上传文件</h3>
    <input type="file" id="upload-file">
    <button id="upload-btn">上传到 saves/</button>
    <div id="upload-msg"></div>
  </div>
  
  <!-- 文件列表 -->
  <div class="file-list">
    <h3>
      已存档文件
      <button class="refresh-btn" onclick="loadFiles()">🔄 刷新</button>
    </h3>
    <div id="files-container">
      <div class="empty">加载中...</div>
    </div>
  </div>
</div>

<script>
const WORKER = 'https://sweet-shape-6382.3906951201.workers.dev';

// ===== 上传 =====
document.getElementById('upload-btn').addEventListener('click', async () => {
  const input = document.getElementById('upload-file');
  const msg = document.getElementById('upload-msg');
  if (!input.files.length) { msg.textContent = '⚠️ 请先选择文件'; msg.style.color = 'orange'; return; }
  
  const file = input.files[0];
  const safeName = file.name.replace(/[^\w\d\.\-]/g, '_');
  msg.textContent = '⏳ 上传中...'; msg.style.color = '#333';
  
  try {
    const res = await fetch(`${WORKER}?file=${encodeURIComponent(safeName)}`, {
      method: 'POST', body: file
    });
    const text = await res.text();
    if (res.ok) {
      msg.textContent = '✅ ' + text; msg.style.color = 'green';
      input.value = '';
      loadFiles(); // 自动刷新列表
    } else {
      msg.textContent = '❌ ' + text; msg.style.color = 'red';
    }
  } catch(e) {
    msg.textContent = '❌ ' + e.message; msg.style.color = 'red';
  }
});

// ===== 列出文件 =====
async function loadFiles() {
  const container = document.getElementById('files-container');
  container.innerHTML = '<div class="empty">加载中...</div>';
  try {
    const res = await fetch(WORKER, { method: 'GET' });
    const data = await res.json();
    if (!data.files || data.files.length === 0) {
      container.innerHTML = '<div class="empty">暂无文件，上传第一个吧！</div>';
      return;
    }
    container.innerHTML = data.files.map(f => `
      <div class="file-item">
        <div>
          <span class="file-name">📄 ${f.name}</span>
          <span class="file-meta">(${(f.size/1024).toFixed(1)} KB)</span>
        </div>
        <div class="file-actions">
          <a href="${f.url}" download="${f.name}">⬇ 下载</a>
        </div>
      </div>
    `).join('');
  } catch(e) {
    container.innerHTML = `<div class="empty">加载失败: ${e.message}</div>`;
  }
}

// 页面加载时拉取
loadFiles();
</script>
</body>
</html>
