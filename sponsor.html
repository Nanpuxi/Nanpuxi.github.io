<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赞助南浦Xi</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- 主题初始化：在渲染前同步读取偏好，避免深色模式闪烁 -->
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var dark = saved ? saved === 'dark' : systemDark;
      if (dark) document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>

  <style>
    /* ===== 主题配色变量 ===== */
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --text-soft: #666;
      --text-mute: #888;
      --text-faint: #aaa;
      --card-bg: #fafafa;
      --card-border: #f0f0f0;
      --card-border-hover: #e4e4e8;
      --placeholder-bg: #f0f0f0;
      --placeholder-color: #bbb;
      --afdian-bg-from: #fff8e1;
      --afdian-bg-to: #fff3e0;
      --afdian-border: #ffe0b2;
      --afdian-btn: #ffd54f;
      --afdian-btn-fg: #5d4037;
      --afdian-shadow: rgba(255,213,79,0.5);
      --heart: #e53935;
      --btn-bg: #1a1a1a;
      --btn-color: #fff;
    }

    html[data-theme="dark"] {
      --bg: #15161a;
      --text: #e8e8ea;
      --text-soft: #a8a8ae;
      --text-mute: #8a8a92;
      --text-faint: #6a6a72;
      --card-bg: #1e1f24;
      --card-border: #2a2b31;
      --card-border-hover: #383940;
      --placeholder-bg: #26272d;
      --placeholder-color: #6a6a72;
      --afdian-bg-from: #2c2618;
      --afdian-bg-to: #2a2418;
      --afdian-border: #4a3c20;
      --afdian-btn: #b8922e;
      --afdian-btn-fg: #1a1208;
      --afdian-shadow: rgba(184,146,46,0.35);
      --heart: #ff6b6b;
      --btn-bg: #e8e8ea;
      --btn-color: #15161a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      transition: background .35s ease, color .35s ease;
    }

    /* ===== 导航栏 ===== */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 48px;
      max-width: 960px;
      margin: 0 auto;
    }

    .nav-brand {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 28px;
    }

    .nav-links a {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      transition: opacity .2s;
      position: relative;
    }

    .nav-links a:hover { opacity: 0.6; }

    .nav-links a.active::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--text);
    }

    /* ===== 主内容 ===== */
    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 60px 24px 60px;
      text-align: center;
    }

    .hero-title {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }

    .hero-sub {
      font-size: 16px;
      color: var(--text-mute);
      margin-bottom: 48px;
    }

    /* ===== 赞助卡片 ===== */
    .sponsor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 40px;
    }

    .sponsor-card {
      padding: 32px 24px;
      border-radius: 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      transition: transform .2s, box-shadow .2s, background .2s, border-color .2s;
    }

    .sponsor-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 30px rgba(0,0,0,.35);
      border-color: var(--card-border-hover);
    }

    .sponsor-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .sponsor-card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .sponsor-card-desc {
      font-size: 13px;
      color: var(--text-mute);
      margin-bottom: 20px;
    }

    .qrcode-placeholder {
      width: 160px;
      height: 160px;
      margin: 0 auto 12px;
      border-radius: 12px;
      background: var(--placeholder-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: var(--placeholder-color);
      overflow: hidden;
    }

    .qrcode-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .sponsor-hint {
      font-size: 12px;
      color: var(--text-faint);
    }

    /* ===== 爱发电区域 ===== */
    .afdian-section {
      margin-top: 16px;
      padding: 36px 24px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--afdian-bg-from) 0%, var(--afdian-bg-to) 100%);
      border: 1px solid var(--afdian-border);
      transition: background .35s ease, border-color .35s ease;
    }

    .afdian-icon {
      font-size: 44px;
      margin-bottom: 12px;
    }

    .afdian-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .afdian-desc {
      font-size: 14px;
      color: var(--text-mute);
      margin-bottom: 20px;
    }

    .afdian-btn {
      display: inline-block;
      padding: 12px 32px;
      border-radius: 10px;
      background: var(--afdian-btn);
      color: var(--afdian-btn-fg);
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      transition: transform .15s, box-shadow .15s, background .35s ease, color .35s ease;
    }

    .afdian-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--afdian-shadow);
    }

    .afdian-btn:active {
      transform: scale(0.96);
    }

    /* ===== 感谢语 ===== */
    .thanks-text {
      margin-top: 48px;
      font-size: 15px;
      color: var(--text-mute);
      line-height: 1.8;
    }

    .thanks-text .heart {
      color: var(--heart);
      animation: heartbeat 1.2s ease-in-out infinite;
      display: inline-block;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.25); }
    }

    /* ===== 页脚 ===== */
    .footer {
      text-align: center;
      padding: 32px 24px;
      font-size: 12px;
      color: var(--text-faint);
    }

    /* ===== 回到顶部按钮 ===== */
    .back-to-top {
      position: fixed;
      bottom: 32px;
      right: 32px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--btn-bg);
      color: var(--btn-color);
      border: none;
      font-size: 20px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(0,0,0,.2);
      transition: opacity .3s, transform .3s, background .35s ease, color .35s ease;
      z-index: 100;
    }

    .back-to-top.visible {
      display: flex;
      animation: fadeInUp .3s ease;
    }

    .back-to-top:hover {
      filter: brightness(1.15);
      transform: scale(1.08);
      box-shadow: 0 6px 20px rgba(0,0,0,.3);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== 入场动画 ===== */
    .fade-in-up {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUpCustom .6s cubic-bezier(.25,.8,.25,1) forwards;
    }

    @keyframes fadeInUpCustom {
      to { opacity: 1; transform: translateY(0); }
    }

    .delay-1 { animation-delay: .15s; }
    .delay-2 { animation-delay: .30s; }
    .delay-3 { animation-delay: .45s; }
    .delay-4 { animation-delay: .60s; }

    /* ===== 响应式 ===== */
    @media (max-width: 600px) {
      .nav { padding: 16px 20px; }
      .container { padding: 40px 20px; }
      .hero-title { font-size: 32px; }
      .sponsor-grid { grid-template-columns: 1fr; }
    }

    /* ===== 深色模式切换按钮 ===== */
    .theme-toggle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      line-height: 1;
      padding: 0;
      transition: transform .25s ease, background .25s ease, border-color .25s ease;
      margin-left: 8px;
    }

    .theme-toggle:hover {
      transform: scale(1.08);
      border-color: var(--card-border-hover);
    }

    .theme-toggle:active {
      transform: scale(0.92);
    }

    .theme-toggle .icon-sun { display: none; }
    html[data-theme="dark"] .theme-toggle .icon-sun { display: inline; }
    html[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
  </style>
</head>
<body>

  <!-- 导航栏 -->
  <nav class="nav">
    <a href="index.html" class="nav-brand">南浦Xi</a>
    <div class="nav-links">
      <a href="index.html">首页</a>
      <a href="sponsor.html" class="active">赞助</a>
      <button class="theme-toggle" id="themeToggle" title="切换深色/浅色模式" aria-label="切换主题">
        <span class="icon-moon">🌙</span>
        <span class="icon-sun">☀️</span>
      </button>
    </div>
  </nav>

  <!-- 主内容 -->
  <main class="container">

    <h1 class="hero-title fade-in-up">☕ 请我喝杯奶茶</h1>
    <p class="hero-sub fade-in-up delay-1">你的支持是我更新的最大动力~</p>

    <!-- 微信 + 支付宝 -->
    <div class="sponsor-grid fade-in-up delay-2">
      <!-- 微信 -->
      <div class="sponsor-card">
        <div class="sponsor-icon">💚</div>
        <div class="sponsor-card-title">微信支付</div>
        <div class="sponsor-card-desc">扫码用微信向我打赏</div>
        <div class="qrcode-placeholder" id="wechatQr">
          <img src="wechat_qr.png" alt="微信收款码">
        </div>
        <div class="sponsor-hint">长按/扫码即可转账</div>
      </div>

      <!-- 支付宝 -->
      <div class="sponsor-card">
        <div class="sponsor-icon">💙</div>
        <div class="sponsor-card-title">支付宝</div>
        <div class="sponsor-card-desc">扫码用支付宝向我打赏</div>
        <div class="qrcode-placeholder" id="alipayQr">
          <img src="alipay_qr.png" alt="支付宝收款码">
        </div>
        <div class="sponsor-hint">长按/扫码即可转账</div>
      </div>
    </div>

    <!-- 爱发电 -->
    <div class="afdian-section fade-in-up delay-3">
      <div class="afdian-icon">⚡</div>
      <div class="afdian-title">爱发电 · 月度赞助</div>
      <div class="afdian-desc">支持我持续产出内容，还能解锁专属福利~</div>
      <a href="https://www.ifdian.net/a/nanpuxi" target="_blank" rel="noopener" class="afdian-btn">
        ⚡ 去爱发电赞助
      </a>
    </div>

    <!-- 感谢语 -->
    <div class="thanks-text fade-in-up delay-4">
      <p>你的支持是我创作最大的动力 <span class="heart">❤️</span></p>
    </div>

  </main>

  <!-- 页脚 -->
  <footer class="footer">
    喵喵喵 · 感谢支持
  </footer>

  <!-- 回到顶部按钮 -->
  <button class="back-to-top" id="backToTop" title="回到顶部">↑</button>

  <script>
    // 回到顶部
    const backToTopBtn = document.getElementById('backToTop');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 30) {
        backToTopBtn.classList.add('visible');
      } else {
        backToTopBtn.classList.remove('visible');
      }
    });
    backToTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // 收款码图片兜底：如果图片加载失败，显示占位文字
    function setupQrFallback(id, label) {
      const container = document.getElementById(id);
      const img = container.querySelector('img');
      if (!img) return;
      img.addEventListener('error', () => {
        container.innerHTML = '<span>' + label + '</span>';
      });
    }
    setupQrFallback('wechatQr', '微信收款码');
    setupQrFallback('alipayQr', '支付宝收款码');

    // ===== 深色模式切换 =====
    (function () {
      var btn = document.getElementById('themeToggle');
      var root = document.documentElement;
      var systemDark = window.matchMedia('(prefers-color-scheme: dark)');

      function applyTheme(theme) {
        if (theme === 'dark') {
          root.setAttribute('data-theme', 'dark');
        } else {
          root.removeAttribute('data-theme');
        }
      }

      // 跟随系统主题变化（仅当用户未手动选择时）
      systemDark.addEventListener('change', function (e) {
        var saved = null;
        try { saved = localStorage.getItem('theme'); } catch (err) {}
        if (!saved) applyTheme(e.matches ? 'dark' : 'light');
      });

      btn.addEventListener('click', function () {
        var isDark = root.getAttribute('data-theme') === 'dark';
        var next = isDark ? 'light' : 'dark';
        applyTheme(next);
        try { localStorage.setItem('theme', next); } catch (err) {}
      });
    })();
  </script>

</body>
</html>
