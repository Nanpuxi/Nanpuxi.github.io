// ===== 深色模式切换（跟主站一致） =====
(function () {
var btn = document.getElementById('themeToggle');
var root = document.documentElement;
var systemDark = window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme(theme) {
if (theme === 'dark') root.setAttribute('data-theme', 'dark');
else root.removeAttribute('data-theme');
}
systemDark.addEventListener('change', function (e) {
var saved = null;
try { saved = localStorage.getItem('theme'); } catch (err) {}
if (!saved) applyTheme(e.matches ? 'dark' : 'light');
});
btn.addEventListener('click', function () {
var isDark = root.getAttribute('data-theme') === 'dark';
var next = isDark ? 'light' : 'dark';
applyTheme(next);
try { localStorage.setItem('theme', next); } catch (err) {}
});
})();

// ===== 导航链接波纹效果 =====
document.querySelectorAll('.nav-anchor').forEach(link => {
link.addEventListener('click', function(e) {
if (this.href.indexOf('#') !== -1) {
e.preventDefault();
var ripple = document.createElement('span');
ripple.classList.add('ripple');
var rect = this.getBoundingClientRect();
var size = Math.max(rect.width, rect.height);
ripple.style.width = ripple.style.height = size + 'px';
ripple.style.left = '50%';
ripple.style.top = '50%';
ripple.style.transform = 'translate(-50%, -50%) scale(0)';
this.appendChild(ripple);
setTimeout(function() { ripple.remove(); }, 500);
}
});
});

// ===== 原有的 radio 切换显示逻辑 =====
const radios = document.querySelectorAll('input[name="type"]');
const block = document.getElementById('config');
function handleRadioChange() {
const selected = document.querySelector('input[name="type"]:checked');
block.style.display = (selected && selected.value === '4') ? 'flex' : 'none';
}
radios.forEach(radio => radio.addEventListener('change', handleRadioChange));
handleRadioChange();

// ===== 后缀选择逻辑 =====
const errorDisplay = document.getElementById('errorDisplay');
const checkboxGroup = document.getElementById('block');
const collectionDisplay = document.getElementById('collectionDisplay');
const countBadge = document.getElementById('countBadge');
const selectAllBtn = document.getElementById('selectAllBtn');
const deselectAllBtn = document.getElementById('deselectAllBtn');
let wenben = '';

function updateCollection() {
const checkboxes = checkboxGroup.querySelectorAll('input[type="checkbox"]');
const selectedTexts = [];
checkboxes.forEach(cb => {
if (cb.checked) {
const label = cb.closest('label');
if (label) {
const text = label.textContent.trim();
if (text) selectedTexts.push(text);
}
}
});
wenben = selectedTexts.join('');
collectionDisplay.innerHTML = '';
if (selectedTexts.length === 0) {
const emptyMsg = document.createElement('span');
emptyMsg.className = 'normal';
emptyMsg.style.color = 'var(--badge-red-fg)';
emptyMsg.textContent = '请至少选择一个后缀';
collectionDisplay.appendChild(emptyMsg);
errorDisplay.textContent = '请至少选择一个后缀';
errorDisplay.classList.add('show');
} else {
collectionDisplay.textContent = selectedTexts.join(' ');
errorDisplay.textContent = '';
errorDisplay.classList.remove('show');
}
countBadge.textContent = selectedTexts.length + ' 项';
}

checkboxGroup.addEventListener('change', updateCollection);
updateCollection();

const setAllCheckboxes = (checked) => {
checkboxGroup.querySelectorAll('input[type="checkbox"]').forEach(cb => {
cb.checked = checked;
cb.dispatchEvent(new Event('change'));
});
updateCollection();
};
selectAllBtn.addEventListener('click', () => setAllCheckboxes(true));
deselectAllBtn.addEventListener('click', () => setAllCheckboxes(false));

// ===== 添加自定义后缀 =====
const newSuffixInput = document.getElementById('newSuffixInput');
const addSuffixBtn = document.getElementById('addSuffixBtn');
function addCustomSuffix() {
const val = newSuffixInput.value.trim();
if (val === '') { newSuffixInput.focus(); return; }
const existingLabels = checkboxGroup.querySelectorAll('label');
for (let label of existingLabels) {
if (label.textContent.trim().toLowerCase() === val.toLowerCase()) {
newSuffixInput.value = '';
newSuffixInput.focus();
return;
}
}
const label = document.createElement('label');
const checkbox = document.createElement('input');
checkbox.type = 'checkbox';
checkbox.checked = true;
label.appendChild(checkbox);
label.appendChild(document.createTextNode(' ' + val));
checkboxGroup.appendChild(label);
newSuffixInput.value = '';
newSuffixInput.focus();
checkbox.dispatchEvent(new Event('change'));
updateCollection();
}
newSuffixInput.addEventListener('keydown', (e) => {
if (e.key === 'Enter') { e.preventDefault(); addCustomSuffix(); }
});
addSuffixBtn.addEventListener('click', addCustomSuffix);
updateCollection();

// ===== 复制功能 =====
async function copyText(text) {
const cleanedText = text.replace(/^\d+/, '');
try {
await navigator.clipboard.writeText(cleanedText);
} catch {
const ta = document.createElement('textarea');
ta.value = cleanedText;
ta.style.position = 'fixed';
ta.style.left = '-9999px';
document.body.appendChild(ta);
ta.select();
document.execCommand('copy');
document.body.removeChild(ta);
}
}
function showToast() {
const toastMessage = document.getElementById('toastMessage');
toastMessage.classList.add('show');
clearTimeout(toastMessage.timer);
toastMessage.timer = setTimeout(() => toastMessage.classList.remove('show'), 600);
}
document.getElementById('resultList').addEventListener('click', function(e) {
const li = e.target.closest('li');
if (!li) return;
showToast();
copyText(li.textContent.trim());
});
