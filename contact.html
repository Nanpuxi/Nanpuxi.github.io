body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif;background:var(--bg);color:var(--text);margin:0}
.container{max-width:760px;margin:0 auto;padding:48px 20px}

a.btn{display:inline-block;margin-top:12px;padding:10px 20px;background:var(--accent);color:#fff;border-radius:6px;text-decoration:none}
.back{display:inline-block;margin-top:28px;padding:8px 16px;border:1px solid var(--border);border-radius:6px;color:var(--text)}
</style>
</head>
<body>
