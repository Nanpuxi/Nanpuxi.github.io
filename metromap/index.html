<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下载中心</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #f8f9fa;
    --card-bg: #ffffff;
    --text: #2c2c2c;
    --text-secondary: #666666;
    --accent: #2c2c2c;
    --border: #e0e0e0;
    --shadow: rgba(0,0,0,0.06);
    --btn-hover: #3d3d3d;
}

[data-theme="dark"] {
    --bg: #1a1a1a;
    --card-bg: #242424;
    --text: #e0e0e0;
    --text-secondary: #a0a0a0;
    --accent: #d0d0d0;
    --border: #333333;
    --shadow: rgba(0,0,0,0.3);
    --btn-hover: #f0f0f0;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background 0.3s, color 0.3s;
    line-height: 1.6;
}

/* Header */
.header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 1px 4px var(--shadow);
}

.header-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.header-left .logo-icon {
    width: 36px;
    height: 36px;
    background: var(--accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--bg);
    font-size: 18px;
    font-weight: bold;
}

.header-left h1 {
    font-size: 20px;
    font-weight: 600;
}

/* Header Right */
.header-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

/* Theme Toggle */
.theme-toggle {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.3s;
}

.theme-toggle:hover {
    background: var(--btn-hover);
}

/* Home Button */
.home-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 7px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    transition: border-color 0.3s, background 0.3s, color 0.3s;
}

.home-btn:hover {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--bg);
}

[data-theme="dark"] .home-btn:hover {
    color: #1a1a1a;
}

/* Main */
.main {
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 20px;
}

/* Search */
.search-box {
    width: 100%;
    padding: 14px 20px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--card-bg);
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
    margin-bottom: 32px;
}

.search-box:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(44,44,44,0.08);
}

[data-theme="dark"] .search-box:focus {
    box-shadow: 0 0 0 3px rgba(208,208,208,0.12);
}

/* Section */
.section {
    margin-bottom: 40px;
}

.section-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 16px;
    padding-left: 12px;
    border-left: 3px solid var(--accent);
}

/* Grid */
.file-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
}

/* Card */
.file-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    transition: transform 0.2s, box-shadow 0.2s;
    animation: fadeIn 0.4s ease both;
}

.file-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px var(--shadow);
}

.file-card h3 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 6px;
}

.file-card .file-meta {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 14px;
}

/* Download Button */
.download-btn {
    width: 100%;
    padding: 10px;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: background 0.3s, transform 0.1s;
}

.download-btn:hover {
    background: var(--btn-hover);
}

.download-btn:active {
    transform: scale(0.98);
}

[data-theme="dark"] .download-btn {
    color: #1a1a1a;
}

/* Back to Top */
.back-to-top {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 44px;
    height: 44px;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px var(--shadow);
    transition: background 0.3s, opacity 0.3s;
    z-index: 99;
}

.back-to-top:hover {
    background: var(--btn-hover);
}

.back-to-top.show {
    display: flex;
}

[data-theme="dark"] .back-to-top {
    color: #1a1a1a;
}

/* Toast */
.toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--accent);
    color: var(--bg);
    padding: 10px 24px;
    border-radius: 8px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 999;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

[data-theme="dark"] .toast {
    color: #1a1a1a;
}

/* Animation */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Responsive */
@media (max-width: 600px) {
    .header {
        padding: 12px 16px;
    }
    .main {
        padding: 20px 14px;
    }
    .file-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
<body>

<header class="header">
    <div class="header-left">
        <div class="logo-icon">⬇</div>
        <h1>下载中心</h1>
    </div>
    <div class="header-right">
        <a class="home-btn" href="/" title="返回主站"> 返回主站</a>
        <button class="theme-toggle" id="themeToggle">🌗 切换</button>
    </div>
</header>

<main class="main">
    <input type="text" class="search-box" id="searchBox" placeholder="搜索文件...">

    <section class="section">
        <h2 class="section-title">热门资源</h2>
        <div class="file-grid" id="hotFiles"></div>
    </section>

    <section class="section">
        <h2 class="section-title">地铁线路图</h2>
        <div class="file-grid" id="devFiles"></div>
    </section>
</main>

<button class="back-to-top" id="backToTop">↑</button>

<div class="toast" id="toast"></div>

<script>
// Data
const hotFiles = [
    { name: '微信windows版', meta: 'v3.9.10 · 156 MB · EXE', url: 'https://dldir1v6.qq.com/weixin/Universal/Windows/WeChatWin_4.1.15.exe' },
    { name: '广州地铁线网图', meta: 'v14.0 · 503 KB · PNG', url: 'https://www.google.com/chrome/' },
    { name: 'PotPlayer', meta: 'v1.7.22 · 34 MB · ZIP', url: 'https://potplayer.daum.net/' },
    { name: '7-Zip', meta: 'v23.01 · 2 MB · EXE', url: 'https://www.7-zip.org/' },
    { name: 'Everything', meta: 'v1.4.1 · 3 MB · ZIP', url: 'https://www.7-zip.org/' },
    { name: 'Bandizip', meta: 'v7.32 · 8 MB · EXE', url: 'https://www.bandisoft.com/bandizip/' },
];

const devFiles = [
    { name: 'VS Code', meta: 'v1.89 · 92 MB · EXE', url: '#' },
    { name: 'Node.js', meta: 'v20.12 · 28 MB · MSI', url: '#' },
    { name: 'Python', meta: 'v3.12 · 25 MB · EXE', url: '#' },
    { name: 'Git', meta: 'v2.44 · 50 MB · EXE', url: '#' },
    { name: 'Go', meta: 'v1.22 · 140 MB · MSI', url: '#' },
    { name: 'Docker Desktop', meta: 'v4.29 · 510 MB · EXE', url: '#' },
];

// Render
function renderFiles(containerId, files) {
    const container = document.getElementById(containerId);
    container.innerHTML = files.map(file => `
        <div class="file-card">
            <h3>${file.name}</h3>
            <p class="file-meta">${file.meta}</p>
            <button class="download-btn" onclick="handleDownload('${file.url}', '${file.name}')">这里下载</button>
        </div>
    `).join('');
}

renderFiles('hotFiles', hotFiles);
renderFiles('devFiles', devFiles);

// Download
function handleDownload(url, fileName) {
    if (url === '#') {
        showToast(`「${fileName}」下载功能待接入`);
        console.log(`下载: ${fileName}, URL: ${url}`);
        return;
    }
    // 后续接入真实下载时，取消下面注释：
    // window.location.href = url;
}

// Toast
function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
}

// Theme
const themeToggle = document.getElementById('themeToggle');
const savedTheme = localStorage.getItem('theme');
if (savedTheme) {
    document.documentElement.setAttribute('data-theme', savedTheme);
}

themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
});

// Back to Top
const backToTopBtn = document.getElementById('backToTop');
window.addEventListener('scroll', () => {
    if (window.scrollY > 300) {
        backToTopBtn.classList.add('show');
    } else {
        backToTopBtn.classList.remove('show');
    }
});

backToTopBtn.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
});

// Search
const searchBox = document.getElementById('searchBox');
searchBox.addEventListener('input', (e) => {
    const keyword = e.target.value.toLowerCase();
    document.querySelectorAll('.file-card').forEach(card => {
        const text = card.textContent.toLowerCase();
        card.style.display = text.includes(keyword) ? 'block' : 'none';
    });
});
</script>

</body>
</html>
